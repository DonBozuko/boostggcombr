<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Configurações - AI Engineering Reviewer</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --primary: #3b82f6;
      --border: #334155;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      padding: 40px;
      max-width: 600px;
      margin: 0 auto;
    }
    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    h1 { font-size: 24px; margin-bottom: 24px; color: var(--primary); }
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
    input, select {
      width: 100%;
      padding: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }
    .status { margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Configurações de IA</h1>
    <div class="form-group">
      <label>Provedor</label>
      <select id="provider">
        <option value="openai">OpenAI (GPT-4o)</option>
        <option value="anthropic">Anthropic (Claude 3.5 Sonnet)</option>
      </select>
    </div>
    <div class="form-group">
      <label>API Key</label>
      <input type="password" id="apiKey" placeholder="sk-...">
    </div>
    <button id="saveBtn">SALVAR CONFIGURAÇÕES</button>
    <div id="status" class="status"></div>
  </div>
  <script src="options.js"></script>
</body>
</html>
